# mdformat settings for this repo. They live here rather than as command-line
# flags so a local run and CI cannot disagree because someone forgot one.
#
#   python -m mdformat --check .      to check
#   python -m mdformat .              to fix
#
# Markdown only, and nothing under templates/ except templates/README.md:
# the JSON templates are not markdown, and the markdown templates carry
# frontmatter and placeholders that mdformat would mangle.

wrap = "no"
number = true
end_of_line = "lf"
