# ruff settings for the one Python file here, templates/status-triage.py.
#
# ruff.toml rather than pyproject.toml on purpose: this repo ships documentation,
# not a package, and a [project] table would imply otherwise. CI reaches ruff with
# `uvx ruff` and needs no virtual environment.
#
#   python -m ruff check .            lint
#   python -m ruff format --check .   formatting
#
# 120, matching the other repos. Changing it reformats the script in one diff, so
# do that alone.

line-length = 120

[lint]
# The standard set from templates/ruff-lint-snippet.toml. This repo has no
# package and no __init__.py, so the snippet's per-file-ignores and isort
# known-first-party settings are left out.
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by ruff format
    "N802",  # camelCase test methods (legacy convention)
    "N803",  # non-lowercase argument names (scientific code)
    "N806",  # non-lowercase variables in functions (scientific code)
]

[format]
line-ending = "lf"
