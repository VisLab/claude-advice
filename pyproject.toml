# Development tools for this repository. Not a package: there is no
# [build-system], and nothing here is installed except the dev group.
# Lint and format settings stay in ruff.toml and .mdformat.toml.
#
#   python -m venv .venv
#   .venv/Scripts/python -m pip install --upgrade pip  # --group needs pip 25.1+
#   .venv/Scripts/python -m pip install --group dev    # Windows; .venv/bin/ elsewhere

[project]
name = "claude-advice"
version = "0.0.0"
description = "Advice, checklists, and templates for working with AI coding assistants."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "ruff==0.15.16",
    "mdformat==1.0.0",
    "mdformat-gfm==1.0.0",
    "mdformat-front-matters==2.0.0",
    "mdformat-footnote==0.1.3",
    "mdformat-myst==0.3.0",
]
