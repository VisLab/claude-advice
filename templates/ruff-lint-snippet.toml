# ---------------------------------------------------------------------------
# The standard ruff lint block - paste into each repo's pyproject.toml,
# replacing any existing [tool.ruff.lint] select/ignore lists.
#
# Keep the repo's own excludes and any extra per-file-ignores; set
# known-first-party to the repo's import package. While here, delete dead
# config: an ignore for a rule family that is not selected, or a mccabe
# section when C90 is not selected, reads as intent and misleads the next
# reader.
#
# Explained in 01_repo_standards.md.
# ---------------------------------------------------------------------------

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by ruff format
    "N802",  # camelCase test methods (legacy convention)
    "N803",  # non-lowercase argument names (scientific code)
    "N806",  # non-lowercase variables in functions (scientific code)
]

# __init__.py files: unused imports are re-exports, and their import order is
# often curated by hand to avoid circular imports - isort must not reorder them.
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "I001"]

[tool.ruff.lint.isort]
known-first-party = ["REPO_PACKAGE"]
